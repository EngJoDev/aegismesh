[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismesh"
version = "0.1.0"
description = "Ultra-Fast Distributed AI Security Gateway, Semantic Cache & Anti-DDoS Mesh"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Youssef El-Sayed (EngJoDev)"}
]
keywords = [
    "api-gateway",
    "reverse-proxy",
    "cybersecurity",
    "prompt-injection",
    "pii-masking",
    "rate-limiter",
    "semantic-cache",
    "ddos-protection",
    "devsecops",
    "llm-security"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "PyYAML>=6.0",
    "requests>=2.31.0"
]

[project.scripts]
aegismesh = "aegismesh.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegismesh*"]
